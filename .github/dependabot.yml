version: 2
updates:
  # GitHub Actions is the only ecosystem Dependabot can track here. This repo has no
  # npm dependencies (the scripts are plain zero-dependency Node), so there is no
  # package-lock for Dependabot to update. The Docker base is pinned by digest in
  # UPSTREAM.lock and consumed from the upstream Dockerfile at build time, not from a
  # Dockerfile in this repo, so a docker ecosystem block would have nothing to update.
  # Both are deliberately omitted rather than shipped as dead config.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # upload-artifact and download-artifact are a matched pair in release.yml: the
      # chips jobs upload, the package job downloads, and they must share an artifact
      # backend generation to interop. Dependabot sees them as independent deps and
      # would otherwise open a PR for one without the other, re-introducing the
      # cross-major skew that was fixed by hand in 597766d. Grouping forces them into
      # one PR so the pair always moves together.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
