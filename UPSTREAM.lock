  "sourcePinUpstreamsComment": "For each sourcePins commit, the upstream repo and the branch the builder actually clones it from. The CI preflight (scripts/0010-verify.mjs) proves each pin is ancestor-reachable from its ref, so the builder's clone+checkout will find it, BEFORE the ~2h build (ADR-0009, closing the ADR-0005 reachability-gate requirement). Reachability is tested by ref-ancestry (git fetch --filter=tree:0 <url> <ref>, then git merge-base --is-ancestor), NOT by git fetch <url> <sha>: GitHub serves a retained object by explicit SHA even when it is reachable from no ref, so fetch-by-sha passes the exact unreachable pin that breaks the clone (measured 2026-11-14, ADR-0009). The refs match what the builder clones: ESP-IDF via build.sh -I release/v5.5; arduino-esp32 at master via install-arduino.sh; tinyusb at master via update-components.sh. Keys match sourcePins; adding a pin without a matching entry here fails the preflight loud.",
