  "addedDefconfigLinesComment": "Lines appended in-place to a per-chip builder defconfig fragment (ADR-0013), keyed by basename. build.sh composes SDKCONFIG_DEFAULTS with configs/defconfig.$target in every esp32 build phase (idf-libs, main, bootloader, mem-variant), so one appended line covers them all. configs/defconfig.esp32 enables CONFIG_SPIRAM=y but sets no REV_MIN, so IDF defaults to rev 0 and force-enables the PSRAM cache workaround (CONFIG_SPIRAM_CACHE_WORKAROUND plus the CONFIG_SPIRAM_CACHE_LIB*_IN_IRAM set), relocating ~12 libc groups into IRAM and overflowing esp32 IRAM by 7272 bytes for a consumer firmware (measured 2026-11-14, adversary m5stick; esp32s3 unaffected, no such errata). CONFIG_ESP32_REV_MIN_3=y matches the reference blob (REV_MIN=3), drops the workaround and recovers the IRAM; it raises the minimum supported ESP32 silicon to rev 3.0, which the consumers already run on via the blob. Appended in-place, not via the sdkconfig/ file-copy overlay (a copy would clobber defconfig.esp32's BT/SPIRAM/TWAI lines); appendDefconfigLines fails loud if the symbol is already present or the target file is absent. The defconfig.qio_ram entry (ADR-0015) disables the esp32s3 quad/qspi boot-time PSRAM hardware init: IDF 5.5 split CONFIG_SPIRAM_BOOT_HW_INIT out of CONFIG_SPIRAM_BOOT_INIT (default y if SPIRAM), so the stock qio_ram fragment's pre-split '# CONFIG_SPIRAM_BOOT_INIT is not set' no longer disables the hardware init, which then aborts at boot on a PSRAM-less board (measured 2026-11-14, StampS3 Cardputer boot loop). Setting it off matches the blob and restores the fragment's optional-PSRAM intent; qio_ram feeds the base idf-libs build, both quad/qspi variants and the qio_ram bootloaders. The opi_ram (octal) path already tolerates a missing chip via CONFIG_SPIRAM_IGNORE_NOTFOUND=y, so it is left unchanged.",
  "addedDefconfigLines": {
    "defconfig.esp32": ["CONFIG_ESP32_REV_MIN_3=y"],
    "defconfig.qio_ram": ["CONFIG_SPIRAM_BOOT_HW_INIT=n"]
  },
  "managedComponentPinsComment": "Upstream declares its ML/camera managed components as floating minimums in main/idf_component.yml, so the component manager resolves 'latest' at build time: unreproducible, and the reason esp-tflite-micro 1.4.3 (2026-11-10) broke the build by forcing -std=c++11 on its own C++17 code (ADR-0004). This is now empty: esp-tflite-micro was its only entry, and slice-0012 removes esp-tflite-micro entirely (you cannot pin a component you do not build; see removedComponents, ADR-0011). The pinComponentVersions mechanism stays wired for the next floating component that must be pinned rather than removed.",
