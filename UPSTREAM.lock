  "removedDefconfigSymbolsComment": "CONFIG_ lines in configs/defconfig.common that the component removals above orphan: each names a symbol declared only by a removed component's Kconfig, so with the component gone IDF treats the line as an unknown symbol (a warning, not a definition). Stripping them is behaviour-neutral cleanup (the symbol is already absent from sdkconfig.h either way), proven safe by the esp_matter orphans staying harmless since v0.0.1 (ADR-0006, ADR-0011). Matter symbols are esp_matter's (removed ADR-0006); RMAKER/INSIGHTS/DIAG are esp_rainmaker/esp_insights/esp_diagnostics' (removed here). stripDefconfigSymbols matches each symbol EXACTLY, so CONFIG_ESP_INSIGHTS_COREDUMP_ENABLE cannot take out the kept CONFIG_ESP_COREDUMP_* lines, and fails loud if a listed symbol has no line.",
