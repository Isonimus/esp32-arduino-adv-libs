  "builderCxxStandardComment": "The builder's idf-release_v5.5 branch (pin e68e301) forces the whole project to C++17 via its root CMakeLists.txt: idf_build_set_property(CXX_COMPILE_OPTIONS \"-std=gnu++17;-DCHIP_HAVE_CONFIG_H\" APPEND) appends -std=gnu++17 AFTER IDF 5.5's own -std=gnu++2b, so the last flag wins. We pin arduino-esp32 to a master-base commit (ADR-0005) newer than that stale branch tracks, and that arduino (HTTPClient) and the esp-dl managed component build aggregates with parenthesized constructor calls (emplace_back(a, b) on a braceless-aggregate struct), legal only from C++20 (P0960); under gnu++17 both fail 'no matching function for call', one per chip (esp32 in HTTPClient, esp32s3 in esp-dl). Espressif's own builder master already bumped this line to -std=gnu++2a; we match that minimal C++20 standard (not gnu++2b) via an overlay rewrite of the cloned builder's CMakeLists.txt. applyOverlay calls setBuilderCxxStandard, which fails loud if the 'from' flag is absent (ADR-0007). The orphaned -DCHIP_HAVE_CONFIG_H define on the same line is left untouched: harmless with esp_matter removed, tracked in LEDGER.",
