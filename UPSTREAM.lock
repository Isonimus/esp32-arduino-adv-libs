  "removedComponentsComment": "Managed components the consumer firmwares (adversary, wifi-sapper) never use, removed from the builder's main/idf_component.yml so they are neither downloaded nor built (ADR-0006, ADR-0011). esp_matter was first (ADR-0006): the stock espressif builder's config cannot build its OpenThread console on esp32/esp32s3 (Thread off), and removing it self-disables arduino-esp32's Matter library (guarded by CONFIG_ESP_MATTER_ENABLE_DATA_MODEL). slice-0012 adds esp32-camera and esp-tflite-micro, the other two main-declared unused components (ADR-0011); neither is compiled into the libs (camera has no core library, tflite's arduino library has no built sources). esp-sr stays in main for now: it is entangled with the builder's esp_sr feature (builds.json + srmodels_bin + defconfig.esp_sr), removed in its own slice. The Zigbee pair and the RainMaker cluster are declared by arduino-esp32, not here: see removedArduinoComponents.",
  "removedComponents": ["espressif/esp_matter", "espressif/esp32-camera", "espressif/esp-tflite-micro"],
  "removedArduinoComponentsComment": "Managed components arduino-esp32 declares in its OWN idf_component.yml (not the builder's main), which the build clones and the overlay force-checks-out to arduinoCommit at build time (ADR-0005). That manifest therefore only exists in-container, so applyOverlay cannot rewrite it host-side; instead it copies scripts/overlay/strip-manifest-components.py into the builder and injects a python3 call into build.sh right after the arduino checkout (ADR-0011). Each arduino library consuming these self-disables when the component's Kconfig vanishes: Zigbee under CONFIG_ZB_ENABLED, the RainMaker cluster under CONFIG_ESP_RMAKER_WORK_QUEUE_TASK_STACK / CONFIG_ESP_INSIGHTS_ENABLED / CONFIG_NETWORK_PROV_NETWORK_TYPE_WIFI, qrcode under WiFiProv's #if __has_include fallback (measured 2026-11-14, zero unconditional uses on esp32/esp32s3; ADR-0011).",
