  "sourcePinsComment": "The upstream builder clones ESP-IDF, arduino-esp32, and tinyusb at floating branch heads, which drift and only agree at the instant Espressif cuts a release. We pin all three to exact commits matching the snapshot the consumers' reference blob was built from (measured 2025-12-05 from its versions.txt). Each pin must be an exact commit REACHABLE from a clonable ref on its upstream, so a normal clone contains it: a loose object that exists only by SHA is not enough (git checkout fails 'reference is not a tree'). The blob's versions.txt records arduino as bmorcelli/arduino-esp32 master 32709d56, a downstream-fork merge commit that is unreachable from any espressif ref; its espressif-upstream base is 9b3364c6 (espressif master 2025-12-04), whose arduino source is byte-identical (the only diff is bmorcelli's own CI yaml), so we pin that reachable base (ADR-0005 Amendment 2026-11-13). IDF 8410210c9a is a reachable ancestor of release/v5.5, pinned via build.sh -i on top of the -I release/v5.5 clone branch; arduino and tinyusb are pinned by force-checkouts applyOverlay injects into build.sh after their clones (ADR-0005, superseding ADR-0003's float-the-branch choice). tinyusb is NOT the blob's commit: the blob's 93b53158 (2025-12-05) is coherent with the blob's own builder (bmorcelli's fork), but our stock builder (e68e301, Jan 2025) vendors components/arduino_tinyusb/src/dcd_dwc2.c keyed to the tinyusb master it clones at build time, which by late 2025 had refactored the dwc2 _bm register API and dcd_edpt_xfer signature the Jan-2025 driver uses (esp32s3 failed 'no member named ghwcfg2_bm', 'conflicting types for dcd_edpt_xfer'). So tinyusb is pinned to master HEAD at the builder's own commit date, 91214b46 (2025-01-21), which the builder would itself have cloned and whose headers the vendored driver compiles against; reachable from master (strict ancestor). A source pin's anchor is the stock builder's era, not the blob's (ADR-0008).",
